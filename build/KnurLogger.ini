# KnurLogger configuration
#
# This file sits BESIDE THE BINARY and is resolved from /proc/self/exe, not from the working
# directory, so a systemd start and a hand-run from any directory read the same file.
#
# --------------------------
# 'filesDir' is where session files live: they land in '<filesDir>/sessions/'. Nothing else of the
# logger's state is kept there - the DS18B20 bindings used to be, in a separate channels.ini, and
# are now in this file (owner decision, 2026-09-10). Do not rebuild that second file.
#
# --------------------------
# 'fsyncIntervalMs' is the durability cadence for the append-only session file. ~1000 ms is the
# plan's figure and the reasoning is in Step 0b item 5b: the supply disappears without warning, so
# the last durable write bounds the loss. Flushing per sample at 10 Hz
# would shorten that window at the price of write amplification without changing the failure mode.
# The supply is CONSTANT 12 V as built, so the cut to survive is the fuse being pulled at the end of
# the day, or a cranking dip - not ignition-off.
#
# 'supplyIntervalMs' is the supply-telemetry cadence. 1000 ms is free — vcgencmd costs ~3 ms per
# call, measured — and cannot miss a transient, because get_throttled's bits 16-19 latch.
#
# --------------------------
# 'tempIntervalMs' is the DS18B20 sampling period. The part needs up to 750 ms for a 12-bit
# conversion, so anything much below 1000 ms leaves no idle bus time. Plan thermal item 2 says
# start around 1 Hz.
#
# --------------------------
# 'temp0OffsetC'..'temp3OffsetC' are calibration offsets in degrees Celsius, added to the reading
# before it is sent to RaceChrono. All four keys must be present; a missing one is a startup error
# rather than a silent zero, because an offset that quietly stopped being applied would be
# invisible in the data it corrupts. Leave them at 0.0 until there is a measurement.
#
# HOW TO GET THE NUMBERS. Park the car long enough to reach equilibrium — engine cold, no sun, no
# residual heat — and run one stationary logging session. At equilibrium all four probes sit in the
# same air, so their differences are sensor error and nothing else. Read the four values out of the
# session file's 1 Hz 'temp' records and enter each probe's deviation from the four-probe mean.
# Only RELATIVE offsets mean anything: there is no reference thermometer on the car, and
# dT_preheat depends on the differences between the four probes, not on their absolute accuracy.
# Entering nothing is a legitimate outcome if the differences are small against a ~6 K signal.
#
# THESE ARE KEYED TO THE CHANNEL SLOT, NOT TO THE PROBE (owner decision, 2026-09-10). An offset is
# really a property of one particular DS18B20, so if the probes are ever re-enrolled in a different
# order, or one is swapped, the offsets stay with the slots and no longer describe the parts sitting
# in them — RE-CHECK THEM after any re-enrollment. In exchange they live here, in the git-tracked
# config beside every other setting, rather than in the data directory where a wipe would take them.
#
# The session file records the raw reading in 'centiC', the offset in force in 'offsetC' and the
# value that actually went on the air in 'sentCentiC', so a mistyped offset costs a reprocess
# rather than the session. Anything past 5 C is warned about at startup as a likely decimal-point
# slip and then applied anyway; past 50 C the logger refuses to start.
#
# --------------------------
# 'temp0RomId'..'temp3RomId' are the DS18B20 ROM ID -> channel bindings, and they are MACHINE
# WRITTEN by '--enroll'. Every other line of this file is copied through byte for byte when that
# happens, comments included, so it stays hand-maintainable.
#
# An empty value is an unbound channel, which is a legitimate state - unlike a missing offset,
# which is a startup failure. A logger that has never been to the car has no bindings to have.
#
# 'temp<N>BoundTaiUs' is the bind time the logger reads back; 'temp<N>BoundIso' is the same instant
# spelled out for a human and is never read. The Pi has no RTC and no NTP in the car, so a bind time
# can be wrong by however long ago the last bench sync was - it is provenance, not evidence.
#
# THE BINDINGS AND THE OFFSETS SHARE THIS SECTION ON PURPOSE. An offset belongs to one particular
# DS18B20 but is keyed to the slot, so a re-enrollment in a different order, or a swapped probe,
# leaves the offsets describing parts that are no longer there. Having both in front of you is the
# point: change a RomId line and the OffsetC line above it is the one to re-check.
#
# Editing a ROM ID by hand is allowed and guarded: anything that is not a 15-character '28-...' is
# refused and logged, and one ROM ID on two channels is refused on the second.
#
# --------------------------
# 'bleDeviceName' is the name advertised to RaceChrono. Keep it distinguishable from the KnurDash
# box at a glance in RaceChrono's device list.
#
# --------------------------
# 'i2cBus' is 1. /dev/i2c-20 and /dev/i2c-21 also exist and are the VC4 display DDC buses, nothing
# to do with the perfboard.
#
# 'bme280Address' is 0x77 = 119 AS BUILT, not the 0x76 the build sheet originally specified: the
# breakout's own SDO pull-up wins, and the owner amended the document rather than the board
# (2026-09-09). Decimal, because the ini reader takes integers.
#
# 'bme280IntervalMs' is the BME280 sampling period. 1000 ms matches the other 1 Hz channels and
# is nowhere near a limit: a forced-mode conversion at x1 oversampling costs ~9 ms and the part
# sleeps in between. That configuration is chosen for LOWEST SELF-HEATING rather than for power,
# because this part is the cavity thermometer (plan item 1c) and any heat it makes is an error in
# the quantity it exists to report.
#
# WHAT THE THREE BME280 CHANNELS ARE FOR, because two of them are easy to point at the wrong
# thing. Temperature is the CAVITY THERMOMETER, with Pi SoC temperature a cross-check and not the
# primary proxy - it is NOT the inlet density term, which is T_ambient's DS18B20. Pressure is
# ENCLOSURE PRESSURE and never a static reference: the cavity is aerodynamically live and at
# Cp -1 the offset is ~464 Pa against 45-90 Pa measurands. Humidity is a seal and desiccant
# diagnostic and has no measurement consumer.
#
# 'muxAddress' is 0x70 = 112, the PCA9548A with A0/A1/A2 grounded.
#
# --------------------------
# 'pressureIntervalMs' is the SDP810 sampling period. 100 ms = 10 Hz is Step 0b commissioning item
# 4's target and the owner's decision of 2026-09-19. A full five-sensor cycle costs 15.4 ms
# measured, so this is nowhere near a CPU limit — the thing it actually spends is SESSION FILE
# BYTES, at roughly ten times the rate the 1 Hz workers write, and it is the first producer that
# could starve the ~1 s fsync cadence. Lower it if a measured session says so; do not raise it past
# what the card and the writer were shown to take.
#
# 'pressureChannelsEnabled' IS A LIST OF POPULATED MUX CHANNELS AND NOT A COUNT, and the difference
# is not stylistic. A count would say "channels 0 through n-1", which is a claim about which
# channels are SAFE TO ADDRESS — and addressing an unpopulated or faulty channel hangs the ENTIRE
# main I2C bus, mux and BME280 with it, recoverable only by a ~RESET pulse on GPIO17. It has
# happened twice, both times on channel 1 (empty with no pull-ups, then SD1 shorted to SC1), and
# both times i2cdetect still listed every device with both bus lines idle-high while every transfer
# failed. Nothing cheap detects it.
#
# The logger refuses to select any channel not in this list, and refuses to START if the list names
# channel 5 — which is wired but whose pull-ups R13/R14 are footprints only. Fit them and amend
# Hardware/logger-perfboard-wiring.md before adding it. An empty list is legitimate and means a box
# with no pressure sensors fitted; a stray comma is not, because it looks exactly like a channel
# number somebody meant to type.
#
# As built, 2026-09-19: P0/P1/P3/P4 are ±500 Pa parts returning 60 counts/Pa and P2 is the single
# ±125 Pa part returning 240 — NOT the P4 every document specified before that date. The part
# identified itself by product number, which is the only reason the discrepancy was caught, so the
# logger reads product, serial and scale factor back at boot and logs them in 'pressureBaseline'.
# The RETURNED scale factor always wins; the nominal 60 and 240 exist only to warn on a mismatch.
#

[system]
filesDir=/home/chrum/KnurLoggerData
fsyncIntervalMs=1000
supplyIntervalMs=1000

[thermal]
tempIntervalMs=1000
temp0OffsetC=0.0
temp1OffsetC=0.0
temp2OffsetC=0.0
temp3OffsetC=0.0
temp0RomId=28-06254385da1f
temp0BoundTaiUs=1789039546914154
temp0BoundIso=2026-09-10T11:25:46.914154Z
temp1RomId=28-0625424044b7
temp1BoundTaiUs=1789039578402085
temp1BoundIso=2026-09-10T11:26:18.402085Z
temp2RomId=28-062542ac86b6
temp2BoundTaiUs=1789039785858098
temp2BoundIso=2026-09-10T11:29:45.858098Z
temp3RomId=28-0625424e16c9
temp3BoundTaiUs=1789039843521968
temp3BoundIso=2026-09-10T11:30:43.521968Z

[bluetooth]
bleDeviceName=KnurLogger

[sensors]
i2cBus=1
bme280Address=119
bme280IntervalMs=1000
muxAddress=112

[pressure]
pressureIntervalMs=100
pressureChannelsEnabled=0,1,2,3,4

[debug]
verboseMode=true
