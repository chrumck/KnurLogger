# KnurLogger configuration
#
# This file sits BESIDE THE BINARY and is resolved from /proc/self/exe, not from the working
# directory, so a systemd start and a hand-run from any directory read the same file.
#
# --------------------------
# 'filesDir' is where session files and the channel binding store live. Sessions land in
# '<filesDir>/sessions/'; the binding store is '<filesDir>/channels.ini'.
#
# The store is deliberately NOT beside the binary: it is field state that must outlive a rebuild,
# and build/ is where a rebuild lands.
#
# --------------------------
# 'fsyncIntervalMs' is the durability cadence for the append-only session file. ~1000 ms is the
# plan's figure and the reasoning is in Step 0b item 5b: the accessory feed disappears without
# warning at ignition-off, so the last durable write bounds the loss. Flushing per sample at 10 Hz
# would shorten that window at the price of write amplification without changing the failure mode.
#
# 'supplyIntervalMs' is the supply-telemetry cadence. 1000 ms is free — vcgencmd costs ~3 ms per
# call, measured — and cannot miss a transient, because get_throttled's bits 16-19 latch.
#
# --------------------------
# 'tempIntervalMs' is the DS18B20 sampling period. The part needs up to 750 ms for a 12-bit
# conversion, so anything much below 1000 ms leaves no idle bus time. Plan thermal item 2 says
# start around 1 Hz.
#
# 'settlingWindowSeconds' and 'settlingMaxDriftMilliKPerMin' govern the session-start
# common-temperature sample. On a cold car at equilibrium all four probes are at one temperature,
# so the spread between them IS the set of relative offsets that dT_preheat depends on. Whether the
# car is actually settled cannot be judged from a single instant, so the logger samples across a
# window and derives a verdict from each probe's drift rate.
#
# 'settlingMaxDriftMilliKPerMin' is a PLACEHOLDER, not an owner figure — the plan does not yet give
# a number for what counts as settled. The raw per-probe drift rates are recorded regardless, so a
# real threshold can be applied in post-processing later without re-running anything. The logger
# never applies an offset: it records the spread as data, because an offset applied silently cannot
# be un-applied.
#
# --------------------------
# 'bleDeviceName' is the name advertised to RaceChrono. Keep it distinguishable from the KnurDash
# box at a glance in RaceChrono's device list.
#
# --------------------------
# 'i2cBus' is 1. /dev/i2c-20 and /dev/i2c-21 also exist and are the VC4 display DDC buses, nothing
# to do with the perfboard.
#
# 'bme280Address' is 0x77 = 119 AS BUILT, not the 0x76 the build sheet originally specified: the
# breakout's own SDO pull-up wins, and the owner amended the document rather than the board
# (2026-09-09). Decimal, because the ini reader takes integers.
#
# 'muxAddress' is 0x70 = 112, the PCA9548A with A0/A1/A2 grounded.
#

[system]
filesDir=/home/chrum/KnurLoggerData
fsyncIntervalMs=1000
supplyIntervalMs=1000

[thermal]
tempIntervalMs=1000
settlingWindowSeconds=90
settlingMaxDriftMilliKPerMin=50

[bluetooth]
bleDeviceName=KnurLogger

[sensors]
i2cBus=1
bme280Address=119
muxAddress=112

[debug]
verboseMode=true
