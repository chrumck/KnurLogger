# KnurLogger configuration
#
# This file sits BESIDE THE BINARY and is resolved from /proc/self/exe, not from the working
# directory, so a systemd start and a hand-run from any directory read the same file.
#
# --------------------------
# 'filesDir' is where session files and the channel binding store live. Sessions land in
# '<filesDir>/sessions/'; the binding store is '<filesDir>/channels.ini'.
#
# The store is deliberately NOT beside the binary: it is field state that must outlive a rebuild,
# and build/ is where a rebuild lands.
#
# --------------------------
# 'fsyncIntervalMs' is the durability cadence for the append-only session file. ~1000 ms is the
# plan's figure and the reasoning is in Step 0b item 5b: the accessory feed disappears without
# warning at ignition-off, so the last durable write bounds the loss. Flushing per sample at 10 Hz
# would shorten that window at the price of write amplification without changing the failure mode.
#
# 'supplyIntervalMs' is the supply-telemetry cadence. 1000 ms is free — vcgencmd costs ~3 ms per
# call, measured — and cannot miss a transient, because get_throttled's bits 16-19 latch.
#
# --------------------------
# 'tempIntervalMs' is the DS18B20 sampling period. The part needs up to 750 ms for a 12-bit
# conversion, so anything much below 1000 ms leaves no idle bus time. Plan thermal item 2 says
# start around 1 Hz.
#
# --------------------------
# 'temp0OffsetC'..'temp3OffsetC' are calibration offsets in degrees Celsius, added to the reading
# before it is sent to RaceChrono. All four keys must be present; a missing one is a startup error
# rather than a silent zero, because an offset that quietly stopped being applied would be
# invisible in the data it corrupts. Leave them at 0.0 until there is a measurement.
#
# HOW TO GET THE NUMBERS. Park the car long enough to reach equilibrium — engine cold, no sun, no
# residual heat — and run one stationary logging session. At equilibrium all four probes sit in the
# same air, so their differences are sensor error and nothing else. Read the four values out of the
# session file's 1 Hz 'temp' records and enter each probe's deviation from the four-probe mean.
# Only RELATIVE offsets mean anything: there is no reference thermometer on the car, and
# dT_preheat depends on the differences between the four probes, not on their absolute accuracy.
# Entering nothing is a legitimate outcome if the differences are small against a ~6 K signal.
#
# THESE ARE KEYED TO THE CHANNEL SLOT, NOT TO THE PROBE (owner decision, 2026-09-10). An offset is
# really a property of one particular DS18B20, so if the probes are ever re-enrolled in a different
# order, or one is swapped, the offsets stay with the slots and no longer describe the parts sitting
# in them — RE-CHECK THEM after any re-enrollment. In exchange they live here, in the git-tracked
# config beside every other setting, rather than in the data directory where a wipe would take them.
#
# The session file records the raw reading in 'centiC', the offset in force in 'offsetC' and the
# value that actually went on the air in 'sentCentiC', so a mistyped offset costs a reprocess
# rather than the session. Anything past 5 C is warned about at startup as a likely decimal-point
# slip and then applied anyway; past 50 C the logger refuses to start.
#
# The DS18B20 ROM ID -> channel bindings are NOT here. They are machine-written by '--enroll' into
# '<filesDir>/channels.ini'.
#
# --------------------------
# 'bleDeviceName' is the name advertised to RaceChrono. Keep it distinguishable from the KnurDash
# box at a glance in RaceChrono's device list.
#
# --------------------------
# 'i2cBus' is 1. /dev/i2c-20 and /dev/i2c-21 also exist and are the VC4 display DDC buses, nothing
# to do with the perfboard.
#
# 'bme280Address' is 0x77 = 119 AS BUILT, not the 0x76 the build sheet originally specified: the
# breakout's own SDO pull-up wins, and the owner amended the document rather than the board
# (2026-09-09). Decimal, because the ini reader takes integers.
#
# 'muxAddress' is 0x70 = 112, the PCA9548A with A0/A1/A2 grounded.
#

[system]
filesDir=/home/chrum/KnurLoggerData
fsyncIntervalMs=1000
supplyIntervalMs=1000

[thermal]
tempIntervalMs=1000
temp0OffsetC=0.0
temp1OffsetC=0.0
temp2OffsetC=0.0
temp3OffsetC=0.0

[bluetooth]
bleDeviceName=KnurLogger

[sensors]
i2cBus=1
bme280Address=119
muxAddress=112

[debug]
verboseMode=true
