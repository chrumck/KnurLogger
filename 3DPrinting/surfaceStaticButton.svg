<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica,Arial,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#111"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="6" height="6" fill="#dfe4ea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a939d" stroke-width="1"/>
</pattern>
<style>
 .o{fill:none;stroke:#111;stroke-width:1.9;stroke-linejoin:round}
 .t{fill:none;stroke:#111;stroke-width:1.1}
 .hid{fill:none;stroke:#111;stroke-width:1;stroke-dasharray:6 4}
 .fdm{fill:url(#hatch);stroke:#111;stroke-width:1.4}
 .fdmv{fill:#eef1f4;stroke:#111;stroke-width:1.4}
 .brass{fill:#d9b44a;stroke:#111;stroke-width:1.2}
 .solder{fill:#8f969e;stroke:#111;stroke-width:1}
 .epoxy{fill:#a9c7a4;stroke:#111;stroke-width:0.8}
 .air{fill:#ffffff;stroke:none}
 .cl{fill:none;stroke:#0a58ca;stroke-width:1;stroke-dasharray:16 4 3 4}
 .sec{fill:none;stroke:#b3261e;stroke-width:1.6;stroke-dasharray:18 5 3 5}
 .d{fill:none;stroke:#111;stroke-width:0.9;marker-start:url(#ar);marker-end:url(#ar)}
 .l{fill:none;stroke:#111;stroke-width:0.8;marker-end:url(#ar)}
 .e{fill:none;stroke:#111;stroke-width:0.7}
 .pan{fill:none;stroke:#aab1ba;stroke-width:1}
 text{fill:#111;font-size:14px}
 .s{font-size:12.5px} .xs{font-size:11px} .b{font-weight:700}
 .h1{font-size:17px;font-weight:700;letter-spacing:.5px}
 .dim{font-size:13px;font-weight:700}
 .red{fill:#b3261e}
</style></defs>
<rect width="1400" height="1000" fill="#ffffff"/>
<rect x="12" y="12" width="1376" height="976" fill="none" stroke="#111" stroke-width="2"/>
<text x="32" y="46" class="h1">SURFACE STATIC BUTTON, REV A &#8212; hood tap 5D (A3), &#216;30 &#215; 2.0, pressure path in &#216;2.0/1.3 brass</text>
<text x="32" y="66" class="s">FDM body is a fairing only. The sensing hole and every passage are brass. All dimensions mm. Print 3: two for the side-by-side bias check, one spare.</text>
<line x1="32" y1="78" x2="1368" y2="78" stroke="#111" stroke-width="1"/>

<!-- ============ TOP VIEW, 8 px/mm, centre (240,300) ============ -->
<g id="top">
<rect class="pan" x="26" y="90" width="520" height="400"/>
<text x="286" y="112" text-anchor="middle" class="h1">TOP VIEW</text>
<text x="286" y="128" text-anchor="middle" class="xs">scale 8 : 1</text>
<!-- flow arrow -->
<line class="l" x1="70" y1="160" x2="170" y2="160" stroke-width="2"/>
<text x="70" y="152" class="s b">AIRFLOW (forward &#8594; aft)</text>
<!-- body -->
<circle class="fdmv" cx="240" cy="300" r="120"/>
<circle class="t" cx="240" cy="300" r="48"/>
<!-- slot + tube -->
<rect class="epoxy" x="208" y="291.2" width="152" height="17.6"/>
<rect class="brass" x="216" y="292" width="240" height="16"/>
<rect class="solder" x="216" y="292" width="12" height="16"/>
<circle cx="240" cy="300" r="3.2" fill="#111"/>
<!-- centre lines -->
<line class="cl" x1="100" y1="300" x2="480" y2="300"/>
<line class="cl" x1="240" y1="165" x2="240" y2="435"/>
<!-- section marks -->
<line class="sec" x1="60" y1="300" x2="100" y2="300"/>
<text x="46" y="296" class="dim red">A</text>
<line class="sec" x1="480" y1="300" x2="520" y2="300"/>
<text x="524" y="296" class="dim red">A</text>
<line class="sec" x1="240" y1="410" x2="240" y2="440"/>
<text x="234" y="458" class="dim red">B</text>
<!-- dims -->
<line class="e" x1="120" y1="300" x2="120" y2="455"/><line class="e" x1="360" y1="300" x2="360" y2="455"/>
<line class="d" x1="120" y1="448" x2="360" y2="448"/>
<text x="300" y="468" text-anchor="middle" class="dim">&#216;30.0 base</text>
<line class="l" x1="330" y1="205" x2="276" y2="262"/>
<text x="334" y="202" class="dim">&#216;12.0 flat top</text>
<line class="l" x1="150" y1="230" x2="236" y2="297"/>
<text x="60" y="222" class="dim">&#216;0.8 hole</text>
<text x="60" y="238" class="xs">at the disc centre</text>
<line class="l" x1="420" y1="340" x2="330" y2="310"/>
<text x="400" y="358" class="s">slot 2.2 wide, full height,</text>
<text x="400" y="373" class="s">4.0 ahead of centre to aft edge</text>
<line class="l" x1="470" y1="260" x2="440" y2="294"/>
<text x="426" y="252" class="s">brass &#216;2.0/1.3</text>
</g>

<!-- ============ SECTION B-B, 30 px/mm, base y=330, centre x=1000 ============ -->
<g id="secB">
<rect class="pan" x="560" y="90" width="814" height="400"/>
<text x="967" y="112" text-anchor="middle" class="h1">SECTION B&#8211;B &#8212; ACROSS THE TUBE AT THE HOLE</text>
<text x="967" y="128" text-anchor="middle" class="xs">scale 30 : 1, central 16 mm shown</text>
<!-- hood -->
<line x1="720" y1="330" x2="1280" y2="330" stroke="#111" stroke-width="2.5"/>
<text x="1200" y="350" class="xs">hood outer surface</text>
<!-- FDM body halves -->
<polygon class="fdm" points="760,330 760,280.7 820,270 967,270 967,330"/>
<polygon class="fdm" points="1033,330 1033,270 1180,270 1240,280.7 1240,330"/>
<!-- break lines -->
<path class="t" d="M760,275 l-6,8 l12,10 l-6,8 l0,29"/>
<path class="t" d="M1240,275 l6,8 l-12,10 l6,8 l0,29"/>
<!-- epoxy fill in slot -->
<rect class="epoxy" x="967" y="270" width="66" height="60"/>
<!-- tube -->
<circle class="brass" cx="1000" cy="300" r="30"/>
<circle class="air" cx="1000" cy="300" r="19.5"/>
<circle class="t" cx="1000" cy="300" r="19.5"/>
<!-- hole through crown -->
<rect class="air" x="988" y="268" width="24" height="14"/>
<line class="t" x1="988" y1="270" x2="988" y2="282"/><line class="t" x1="1012" y1="270" x2="1012" y2="282"/>
<!-- dims -->
<line class="e" x1="967" y1="270" x2="967" y2="200"/><line class="e" x1="1033" y1="270" x2="1033" y2="200"/>
<line class="d" x1="967" y1="208" x2="1033" y2="208"/>
<text x="1000" y="198" text-anchor="middle" class="dim">2.2 slot</text>
<line class="e" x1="988" y1="268" x2="988" y2="232"/><line class="e" x1="1012" y1="268" x2="1012" y2="232"/>
<line class="d" x1="988" y1="240" x2="1012" y2="240"/>
<text x="1030" y="244" class="dim">&#216;0.8</text>
<line class="e" x1="1240" y1="270" x2="1300" y2="270"/><line class="e" x1="1240" y1="330" x2="1300" y2="330"/>
<line class="d" x1="1290" y1="270" x2="1290" y2="330"/>
<text x="1298" y="304" class="dim">2.0</text>
<line class="l" x1="880" y1="390" x2="985" y2="318"/>
<text x="770" y="405" class="s">bore &#216;1.3, wall 0.35 &#8212; the tube's crown is</text>
<text x="770" y="420" class="s">flush with the flat top, so the hole is in brass</text>
<line class="l" x1="1110" y1="390" x2="1025" y2="322"/>
<text x="1060" y="405" class="s">epoxy bond fills the slot gaps;</text>
<text x="1060" y="420" class="s">keep it out of the hole and bore</text>
<line class="l" x1="700" y1="250" x2="800" y2="300"/>
<text x="580" y="240" class="s">FDM fairing</text>
<text x="580" y="455" class="xs">Never smoke-tested directly: channel D is tested through wand 2D with this button as found (pressure-testing.md &#167;2.4 step 5).</text>
<text x="580" y="470" class="xs">Keep the flat top smooth across the brass stripe after bonding. D is not valid in rain; the line needs its trap below the sensor.</text>
</g>

<!-- ============ SECTION A-A, 25 px/mm, x0=500 at the hole, base y=800 ============ -->
<g id="secA">
<rect class="pan" x="26" y="504" width="1348" height="340"/>
<text x="700" y="526" text-anchor="middle" class="h1">SECTION A&#8211;A &#8212; ALONG THE TUBE AXIS</text>
<text x="700" y="542" text-anchor="middle" class="xs">scale 25 : 1. Aft of x = &#8722;4 the cut runs inside the slot, so the body shows only as hidden edges behind the tube.</text>
<line class="l" x1="80" y1="600" x2="200" y2="600" stroke-width="2"/>
<text x="80" y="592" class="s b">AIRFLOW</text>
<!-- hood -->
<line x1="90" y1="800" x2="1310" y2="800" stroke="#111" stroke-width="2.5"/>
<!-- FDM body, cut part forward of slot -->
<polygon class="fdm" points="125,800 125,790 350,750 400,750 400,800"/>
<!-- epoxy between slot end and tube nose -->
<rect class="epoxy" x="400" y="750" width="25" height="50"/>
<!-- tube walls -->
<rect class="brass" x="425" y="791.25" width="750" height="8.75"/>
<rect class="brass" x="425" y="750" width="65" height="8.75"/>
<rect class="brass" x="510" y="750" width="665" height="8.75"/>
<rect class="air" x="462.5" y="758.75" width="712.5" height="32.5"/>
<rect class="solder" x="425" y="758.75" width="37.5" height="32.5"/>
<rect class="solder" x="418" y="750" width="7" height="50"/>
<!-- hole -->
<line class="t" x1="490" y1="750" x2="490" y2="758.75"/><line class="t" x1="510" y1="750" x2="510" y2="758.75"/>
<!-- body beyond the cut, hidden behind tube -->
<polyline class="hid" points="650,750 875,790 875,800"/>
<!-- line joint beyond disc, schematic -->
<rect x="1000" y="738" width="175" height="74" fill="none" stroke="#3a7fb5" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="1000" y="730" class="s">reducer or 2/4 silicone sleeve &#8594; 4/6 line</text>
<text x="1185" y="778" class="s">&#8594; hood gap</text>
<!-- centre line of hole -->
<line class="cl" x1="500" y1="640" x2="500" y2="830"/>
<!-- dims: x positions -->
<line class="e" x1="125" y1="790" x2="125" y2="668"/>
<line class="e" x1="400" y1="750" x2="400" y2="690"/>
<line class="e" x1="425" y1="750" x2="425" y2="712"/>
<line class="e" x1="875" y1="790" x2="875" y2="668"/>
<line class="e" x1="1175" y1="750" x2="1175" y2="668"/>
<line class="d" x1="125" y1="676" x2="500" y2="676"/>
<text x="312" y="670" text-anchor="middle" class="dim">15.0</text>
<line class="d" x1="500" y1="676" x2="875" y2="676"/>
<text x="688" y="670" text-anchor="middle" class="dim">15.0 to aft edge</text>
<line class="d" x1="875" y1="676" x2="1175" y2="676"/>
<text x="1025" y="670" text-anchor="middle" class="dim">12.0 stub</text>
<line class="d" x1="400" y1="698" x2="500" y2="698"/>
<text x="408" y="693" class="dim">4.0</text>
<line class="d" x1="425" y1="720" x2="500" y2="720"/>
<text x="436" y="716" class="dim">3.0</text>
<!-- dims: heights -->
<line class="e" x1="125" y1="790" x2="90" y2="790"/>
<line class="e" x1="125" y1="800" x2="90" y2="800"/>
<text x="42" y="786" class="dim">0.4 edge</text>
<line class="e" x1="350" y1="750" x2="300" y2="750"/>
<line class="d" x1="300" y1="750" x2="300" y2="800"/>
<text x="258" y="780" class="dim">2.0</text>
<!-- labels -->
<line class="l" x1="330" y1="860" x2="440" y2="778"/>
<text x="120" y="875" class="s">solder plug, nose closed and rounded; the plug ends</text>
<text x="120" y="890" class="s">&#8805; 1.0 ahead of the hole's edge</text>
<line class="l" x1="600" y1="860" x2="502" y2="755"/>
<text x="560" y="875" class="s">&#216;0.8 radial hole, drilled square to the base,</text>
<text x="560" y="890" class="s">deburred inside, not countersunk</text>
<line class="l" x1="900" y1="860" x2="760" y2="772"/>
<text x="860" y="875" class="s">flowing brass, hole to stub end: 27 mm</text>
<text x="860" y="890" class="s">&#8776; 7 &#215; 10&#8310; Pa&#183;s/m&#179; (derived, Poiseuille, &#216;1.3 bore)</text>
<text x="620" y="830" class="xs">brass 30 long overall</text>
</g>

<!-- ============ NOTES ============ -->
<line x1="32" y1="908" x2="1368" y2="908" stroke="#111" stroke-width="1"/>
<text x="32" y="928" class="s"><tspan class="b">Print:</tspan> base down, 0.1 layers, ironing on the top, 100 % infill, ASA or PETG (a hood in sun exceeds PLA's softening point). Check the slot takes the tube; widen in the slicer, not with a file.</text>
<text x="32" y="946" class="s"><tspan class="b">Fit:</tspan> thin double-sided tape under body and tube; feather the edge with tape; keep tape off the &#216;12 flat top. Tube axis along the local flow, stub aft. Record hole coordinates on the scan.</text>
<text x="32" y="964" class="s"><tspan class="b">Before use:</tspan> flush with clean dry air; leak-test the joint (pressure-testing.md &#167;1.3 item 1). Its brass adds resistance the logger's R_fixed does not include &#8212; see surfaceStaticButton.md.</text>
</svg>
